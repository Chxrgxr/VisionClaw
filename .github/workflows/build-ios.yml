name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Secrets.swift
        run: |
          cat <<EOF > samples/CameraAccess/CameraAccess/Secrets.swift
          struct Secrets {
              static let geminiApiKey = "${{ secrets.GEMINI_API_KEY }}"
              static let openClawHost = "http://localhost"
              static let openClawPort = 18789
              static let openClawGatewayToken = ""
              static let cloudGatewayURL = ""
              static let cloudGatewayToken = ""
          }
          EOF

      - name: Build Simulator App / Archive
        run: |
          xcodebuild -project samples/CameraAccess/CameraAccess.xcodeproj \
                     -scheme CameraAccess \
                     -sdk iphonesimulator \
                     -destination 'platform=iOS Simulator,name=iPhone 15' \
                     -configuration Release \
                     clean build \
                     CODE_SIGNING_ALLOWED=NO
