name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Create Secrets.swift
        run: |
          cat <<EOF > samples/CameraAccess/CameraAccess/Secrets.swift
          struct Secrets {
              static let geminiApiKey = "${{ secrets.GEMINI_API_KEY }}"
              static let openClawHost = "http://localhost"
              static let openClawPort = 18789
              static let openClawGatewayToken = ""
              static let cloudGatewayURL = ""
              static let cloudGatewayToken = ""
          }
          EOF

      - name: Build App
        run: |
          SCHEME=$(xcodebuild -list -project samples/CameraAccess/CameraAccess.xcodeproj | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | head -n 1 | xargs)
          xcodebuild archive \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath $RUNNER_TEMP/CameraAccess.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Create Payload and IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/CameraAccess.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r VisionClaw.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-IPA
          path: ${{ runner.temp }}/VisionClaw.ipa
