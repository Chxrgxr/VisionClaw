name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    runs-on: macos-14 # Uses GitHub's hosted macOS runner with Xcode 15+

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Create Secrets.swift
        run: |
          cat <<EOF > samples/CameraAccess/CameraAccess/Secrets.swift
          struct Secrets {
              static let geminiApiKey = "${{ secrets.GEMINI_API_KEY }}"
              static let openClawHost = "http://localhost"
              static let openClawPort = 18789
              static let openClawGatewayToken = ""
          }
          EOF

      - name: Build Simulator App / Archive
        run: |
          xcodebuild -project samples/CameraAccess/CameraAccess.xcodeproj \
                     -scheme CameraAccess \
                     -sdk iphonesimulator \
                     -configuration Release \
                     clean build CODE_SIGNING_ALLOWED=NO

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-iOS-Build
          path: samples/CameraAccess/build/Release-iphonesimulator/
